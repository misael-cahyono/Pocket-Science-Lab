<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#2563eb">
  <title>Lab Fisika 3D - LabPocket</title>
  <link rel="stylesheet" href="css/style.css">
  
  <!-- Memuat pustaka Three.js dari CDN resmi untuk rendering 3D di browser -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body class="lab-page">

  <!-- Navigasi Atas -->
  <header class="lab-header">
    <a href="index.html" class="back-btn">← Kembali</a>
    <h1>⚛️ Lab Fisika: Simulasi Bandul</h1>
  </header>

  <!-- Area Tampilan Simulasi 3D (Canvas) -->
  <main class="simulation-container">
    <div id="canvas-container">
      <!-- Three.js akan memasukkan elemen <canvas> secara otomatis di sini -->
    </div>

    <!-- Panel Kontrol Pengguna (Ramah Layar Sentuh HP) -->
    <div class="control-panel">
      <h3>Pengaturan Percobaan</h3>
      
      <div class="control-group">
        <label for="stringLength">Panjang Tali: <span id="lengthVal">2</span> m</label>
        <input type="range" id="stringLength" min="1" max="4" step="0.5" value="2">
      </div>

      <div class="control-group">
        <label for="ballMass">Massa Beban: <span id="massVal">1</span> kg</label>
        <input type="range" id="ballMass" min="0.5" max="3" step="0.5" value="1">
      </div>

      <div class="button-group">
        <button id="toggleSimBtn" class="btn primary">Mulai Simulasi</button>
        <button id="saveDataBtn" class="btn secondary">Simpan ke Catatan</button>
      </div>
    </div>
  </main>

  <!-- Menghubungkan logika khusus fisika -->
  <script src="js/physics.js"></script>
</body>
</html>
